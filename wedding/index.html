<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wedding</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Kat & Leo's Wedding</h1>
      <h2>Feb 15th, 2026 - Cabarete, DR</h2>

      <div class="gallery">
        <figure>
          <img
            src="./img/01-couple-portrait.webp"
            alt="Kat and Leo embracing outdoors"
            width="1333"
            height="2000"
            fetchpriority="high"
          />
        </figure>
        <figure>
          <img
            src="img/02-kat-and-mami.webp"
            alt="Kat walking arm in arm with Mami"
            width="2000"
            height="1333"
            loading="lazy"
            decoding="async"
          />
        </figure>
        <figure>
          <img
            src="img/03-glass-stomp.webp"
            alt="Breaking the glass"
            width="1333"
            height="2000"
            loading="lazy"
            decoding="async"
          />
        </figure>
        <figure>
          <img
            src="./img/04-ceremony-exit.webp"
            alt="Kat and Leo walking up the aisle among their guests"
            width="1333"
            height="2000"
            loading="lazy"
            decoding="async"
          />
        </figure>
        <figure>
          <img
            src="./img/05-beach-portrait.webp"
            alt="Kat and Leo standing together on the beach"
            width="1333"
            height="2000"
            loading="lazy"
            decoding="async"
          />
        </figure>
        <figure>
          <img
            src="./img/06-chair-dance.webp"
            alt="Kat and Leo raised in a chair during the reception"
            width="2000"
            height="1333"
            loading="lazy"
            decoding="async"
          />
        </figure>
        <figure>
          <img
            src="img/07-ceremony-hug.webp"
            alt="The couple hugging during the ceremony"
            width="1333"
            height="2000"
            loading="lazy"
            decoding="async"
          />
        </figure>
      </div>
    </main>
  </body>
</html>
